services:
  web:
    image: ghcr.io/nogringo/openspecs/web:${OPENSPECS_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      OPENSPECS_PUBLIC_URL: ${OPENSPECS_PUBLIC_URL:-}
    # Bound to loopback by default: this service has no TLS and no auth, so it
    # expects something in front of it. Set OPENSPECS_BIND to 0.0.0.0:3000 to
    # publish it, or drop the binding entirely and attach your proxy's network.
    ports:
      - "${OPENSPECS_BIND:-127.0.0.1:3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
